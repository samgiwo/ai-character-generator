<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原創 AI 女角組合產生器</title><style>:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#eee;background:#101321}*{box-sizing:border-box}body{margin:0}header{padding:25px 5%;background:#1c2036}h1{margin:0;font-size:clamp(24px,4vw,35px)}p{color:#b9bdd1}main{max-width:1200px;margin:auto;padding:22px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.panel{background:#1c2036;border:1px solid #3b4057;border-radius:16px;padding:20px;margin-bottom:16px}h2{font-size:18px;margin:0 0 17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;color:#c4c8db;font-size:13px;margin-bottom:6px}select,input,textarea{width:100%;padding:10px;border-radius:9px;background:#101321;color:#fff;border:1px solid #515671;font:inherit}input[type=range]{accent-color:#b29aff}textarea{height:330px;resize:vertical;font-size:13px;line-height:1.6}button{background:#8e75e5;color:#fff;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:600;margin:4px 5px 4px 0}.secondary{background:#353a56}.range{margin:20px 0}.range>div{display:flex;justify-content:space-between;margin-bottom:8px}.range strong{color:#c6b5ff}.sticky{position:sticky;top:15px;align-self:start}.small{font-size:12px;color:#aab1c8}.status{color:#b5f4c7;font-size:13px;min-height:18px}@media(max-width:850px){main{display:block}.sticky{position:static}}@media(max-width:440px){.grid{grid-template-columns:1fr}}</style><header><h1>✦ 原創 AI 女角組合產生器 V3.0</h1><p>東亞 × 歐美混合外貌 · 五官與髮型 · 高寫實角色 Prompt</p></header><main><div id="controls"></div><aside class="sticky"><section class="panel"><h2>即時角色 Prompt</h2><div class="grid"><div><label>語言</label><select id="lang"><option value="en">English</option><option value="zh">繁體中文</option></select></div><div><label>畫面比例</label><select id="ratio"><option>9:16</option><option>3:4</option><option>1:1</option><option>16:9</option></select></div></div><p id="summary" class="small"></p><textarea id="output" readonly></textarea><button id="copy">複製 Prompt</button><button class="secondary" id="txt">下載 TXT</button><div id="status" class="status"></div></section><section class="panel"><h2>角色管理</h2><label>角色名稱</label><input id="name" placeholder="例如：清純系女主角"><button id="save">儲存角色</button><button class="secondary" id="reset">重設</button><label>已儲存角色</label><select id="saved"></select><button id="load">載入</button><button class="secondary" id="remove">刪除</button><hr><button id="export">匯出 JSON</button><button class="secondary" id="import">匯入 JSON</button><input id="file" type="file" accept=".json" hidden><p class="small">資料儲存在本機瀏覽器。請定期匯出備份，跨裝置不會自動同步。</p></section></aside></main><script>
const data={
face:[["petite oval face","小巧鵝蛋臉"],["soft oval face","柔和橢圓臉"],["delicately tapered V-shaped face","精緻V形臉"],["soft round face","圓潤娃娃臉"],["heart-shaped face","心形臉"],["elongated oval face","修長鵝蛋臉"],["soft square face","柔和方臉"],["diamond-shaped face","菱形臉"]],
eyes:[["bright rounded eyes","明亮圓眼"],["large almond eyes","大杏仁眼"],["subtly upturned cat eyes","上挑貓眼"],["gently downturned eyes","微下垂無辜眼"],["elongated almond eyes","細長杏仁眼"],["large deep-set eyes","深邃大眼"],["soft hooded eyes","自然內雙眼"],["natural monolid eyes","自然單眼皮"],["lifted fox-shaped eyes","狐狸眼"]],
brows:[["softly arched eyebrows","柔和弧形眉"],["soft straight eyebrows","自然平眉"],["full natural eyebrows","濃密自然眉"],["fine delicate eyebrows","纖細眉"],["slightly lifted eyebrows","上揚英氣眉"],["feathery eyebrows","羽毛野生眉"]],
nose:[["small nose with a rounded tip","小巧圓鼻頭"],["delicate straight nose","纖細直鼻"],["high straight nose","高挺直鼻"],["small button nose","鈕扣鼻"],["subtly upturned nose","微翹鼻尖"],["soft natural nasal bridge","柔和鼻樑"],["defined sculpted nose","立體精緻鼻"]],
lips:[["small delicate lips","小巧精緻唇"],["naturally pink medium-full lips","自然粉紅中唇"],["full plump lips","豐潤飽滿唇"],["defined cupid's bow","明顯M形唇峰"],["slightly fuller lower lip","下唇較飽滿"],["delicate thin lips","清秀薄唇"],["gently upturned lip corners","微笑唇"]],
skin:[["fair warm-toned skin","白皙暖調"],["fair neutral skin","白皙中性"],["fair cool-toned skin","冷白肌"],["natural ivory complexion","自然象牙色"],["light beige complexion","明亮米膚色"],["warm honey complexion","蜂蜜暖膚色"],["natural golden-tan skin","健康小麥色"],["natural olive-toned skin","自然橄欖色"]],
hairLength:[["collarbone-length hair","鎖骨長度"],["pixie-length hair","極短髮"],["ear-length hair","耳下短髮"],["chin-length hair","及下巴"],["shoulder-length hair","及肩"],["chest-length hair","及胸長髮"],["waist-length hair","及腰長髮"],["extra-long hair","超長髮"]],
hairStyle:[["C-curled ends","C字內彎"],["naturally straight hair","自然柔順直髮"],["sleek silky straight hair","絲滑長直髮"],["inward-curved bob","內彎鮑伯頭"],["Japanese hime cut","日系姬髮式"],["soft Korean layered cut","韓系層次剪"],["soft wolf cut","狼尾層次剪"],["butterfly layered haircut","蝴蝶層次剪"],["soft S-shaped waves","韓系S型波浪"],["loose natural waves","自然微捲"],["voluminous large curls","蓬鬆大捲"],["fine textured curls","羊毛捲"],["high ponytail","高馬尾"],["low ponytail","低馬尾"],["half-up hairstyle","半紮公主頭"],["high bun","丸子頭"],["elegant low bun","低盤髮"],["two braided pigtails","雙麻花辮"],["side braid","側編髮"],["soft tousled hair","慵懶蓬鬆髮"]],
bangs:[["full eyebrow-length bangs","齊眉厚瀏海"],["wispy see-through bangs","韓系空氣瀏海"],["light feathered bangs","輕薄碎瀏海"],["curtain bangs","八字瀏海"],["side-swept bangs","側分斜瀏海"],["short micro bangs","眉上短瀏海"],["long face-framing fringe","長瀏海"],["center part without bangs","中分無瀏海"],["deep side part without bangs","七三側分"],["forehead exposed, no bangs","露額頭無瀏海"]],
hairColor:[["dark chocolate brown","深巧克力棕"],["natural black","自然純黑"],["soft black tea","黑茶色"],["cool ash brown","冷霧亞麻棕"],["chestnut brown","栗子棕"],["milk tea brown","奶茶棕"],["light blonde","淺金色"],["platinum blonde","白金色"],["rose pink brown","玫瑰粉棕"],["burgundy red","酒紅色"],["silver gray","銀灰色"],["blue-black","藍黑色"],["dark brown with subtle highlights","深棕挑染"]],
makeup:[["minimal natural makeup","自然淡妝"],["soft Korean dewy makeup","韓系水光妝"],["subtle Japanese natural makeup","日系透明妝"],["refined K-pop idol makeup","K-pop精緻妝"],["soft peach-toned makeup","蜜桃妝"],["understated cool-toned makeup","冷感淡妝"],["refined Western editorial makeup","歐美時尚妝"],["barely-there makeup","素顏感"]],
expression:[["gentle closed-mouth smile","閉嘴淺笑"],["relaxed neutral expression","自然放鬆"],["warm sweet smile","甜美笑容"],["calm reserved expression","清冷沉靜"],["confident direct gaze","自信眼神"],["subtle shy smile","靦腆微笑"]],
photo:[["front-facing upper-body portrait","正面上半身"],["front-facing head-and-shoulders portrait","正面大頭近拍"],["three-quarter angle portrait","45度側臉"],["clean side-profile portrait","90度側面"],["full-body standing portrait","全身站姿"],["three-view character reference sheet, front, three-quarter and side views","三視圖"]],
region:[["broad contemporary European and North American portrait aesthetics","泛歐美"],["Nordic-inspired editorial aesthetics","北歐"],["Western European-inspired editorial aesthetics","西歐"],["Southern European-inspired editorial aesthetics","南歐"],["Eastern European-inspired editorial aesthetics","東歐"],["contemporary North American editorial beauty aesthetics","北美"]]
};
const groups=[["01｜臉部五官",[["face","臉型"],["eyes","眼型"],["brows","眉型"],["nose","鼻型"],["lips","唇型"],["skin","膚色"]]],["02｜髮型與髮色",[["hairLength","髮長"],["hairStyle","髮型／捲度"],["bangs","瀏海"],["hairColor","髮色"]]],["03｜妝容與構圖",[["makeup","妝容"],["expression","表情"],["photo","構圖"],["region","歐美風格方向"]]]];
const controls=document.getElementById("controls");let settings={age:20,mix:30,depth:45,realism:95};for(const [title,items] of groups){let section=document.createElement("section");section.className="panel";section.innerHTML="<h2>"+title+"</h2>";let grid=document.createElement("div");grid.className="grid";for(const [key,label] of items){let wrap=document.createElement("div"),lab=document.createElement("label"),sel=document.createElement("select");lab.textContent=label;sel.id=key;data[key].forEach(([en,zh])=>sel.add(new Option(zh,en)));sel.addEventListener("change",update);wrap.append(lab,sel);grid.append(wrap)}section.append(grid);controls.append(section)}
const sliders=document.createElement("section");sliders.className="panel";sliders.innerHTML="<h2>04｜混血風格與寫實控制</h2>";controls.prepend(sliders);
for(const [key,label,min,max,step] of [["mix","東亞 × 歐美混血視覺強度",0,100,5],["depth","五官立體度",0,100,5],["realism","皮膚寫實程度",0,100,5],["age","角色年齡",18,40,1]]){let d=document.createElement("div");d.className="range";let top=document.createElement("div");let span=document.createElement("span");span.textContent=label;let strong=document.createElement("strong");strong.id=key+"Value";let input=document.createElement("input");input.type="range";input.id=key;input.min=min;input.max=max;input.step=step;input.value=settings[key];input.addEventListener("input",()=>{settings[key]=Number(input.value);update()});top.append(span,strong);d.append(top,input);sliders.append(d)}
function val(k){return document.getElementById(k).value}function label(k){return data[k].find(x=>x[0]===val(k))?.[1]||""}
function mixText(n){return n===0?"East Asian-inspired facial styling without Western editorial influence":n<=20?"predominantly East Asian-inspired appearance with very subtle European and North American editorial influence":n<=40?"a gentle blend of East Asian and European/North American-inspired facial aesthetics":n<=60?"a balanced East Asian and European/North American-inspired facial aesthetic":n<=80?"a pronounced European/North American-inspired aesthetic blended with East Asian facial styling":"a strongly European/North American-inspired aesthetic with subtle East Asian styling influences"}
function depthText(n){return n<25?"soft brow ridge, gentle eye sockets and smooth cheek contours":n<55?"moderately defined brow ridge, natural eye sockets, softly defined nasal bridge and cheekbones":n<80?"defined brow ridge, dimensional eye sockets and sculpted cheekbones":"strong yet anatomically plausible facial dimension, pronounced brow ridge, defined eye sockets and sculpted cheekbones"}
function build(){let en="An original "+settings.age+"-year-old adult female character, "+["face","eyes","brows","nose","lips","skin"].map(val).join(", ")+(settings.mix===0?". East Asian.":". East Asian x European/North American-inspired character design: "+mixText(settings.mix)+". Selected Western style: "+val("region")+".")+" Facial structure: "+depthText(settings.depth)+". Preserve the explicitly selected eye, nose, face and lip shapes regardless of blend strength. Hair: "+["hairLength","hairStyle","bangs"].map(val).join(", ")+", "+val("hairColor")+" hair color. "+val("makeup")+", "+val("expression")+". "+val("photo")+", "+val("ratio")+" aspect ratio, pure white seamless studio background, realistic human facial anatomy, natural facial asymmetry, "+(settings.realism>=70?"visible fine skin pores, subtle peach fuzz, authentic lip texture, realistic hair strands, natural skin color variation":"softly refined realistic skin texture")+", lifelike eyes, professional 85mm portrait photography, soft diffused lighting, no CGI, no plastic skin, no excessive retouching. Unique fictional person, not resembling any specific celebrity.";let zh="原創 "+settings.age+" 歲成年女性角色。"+["face","eyes","brows","nose","lips","skin"].map(label).join("、")+(settings.mix===0?"。東亞女性外貌設計，五官立體度 ":"。東亞 × 歐美混合外貌設計，歐美視覺風格強度 "+settings.mix+"%，"+label("region")+"風格，五官立體度 ")+settings.depth+"%。保留手動選擇的眼型、鼻型、臉型與唇型。髮型："+["hairLength","hairStyle","bangs","hairColor"].map(label).join("、")+"。"+label("makeup")+"，"+label("expression")+"。"+label("photo")+"，"+val("ratio")+" 比例，純白攝影棚背景，真實皮膚毛孔、自然臉部不對稱、真實髮絲，85mm 人像攝影，柔和燈光，避免塑膠肌與 CGI 感。原創虛構人物，不模仿特定明星。";return val("lang")==="en"?en:zh}
function update(){for(const k of ["mix","depth","realism","age"])document.getElementById(k+"Value").textContent=settings[k]+(k==="age"?" 歲":"%");document.getElementById("summary").textContent=label("face")+" · "+label("eyes")+" · "+label("hairStyle")+" · "+label("hairColor")+" · 歐美風格 "+settings.mix+"%";document.getElementById("output").value=build()}
document.getElementById("lang").onchange=update;document.getElementById("ratio").onchange=update;function notice(s){document.getElementById("status").textContent=s}
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(build());notice("已複製 Prompt")}catch{document.getElementById("output").select();document.execCommand("copy");notice("已嘗試複製")}};
function download(name,content,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById("txt").onclick=()=>download("character-prompt.txt",build(),"text/plain");
const storageKey="character-generator-v3-saved";let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||"{}")}catch{}function refresh(){const s=document.getElementById("saved");s.replaceChildren(new Option("請選擇角色",""));Object.keys(saved).forEach(n=>s.add(new Option(n,n)))}function snapshot(){return{fields:Object.fromEntries(Object.keys(data).map(k=>[k,val(k)])),settings:{...settings},ratio:val("ratio"),lang:val("lang")}}function apply(o){if(!o||typeof o!=="object")return;for(const [k,v] of Object.entries(o.fields||{})){const el=document.getElementById(k);if(el&&data[k]?.some(x=>x[0]===v))el.value=v}for(const k of Object.keys(settings)){const n=Number(o.settings?.[k]);if(Number.isFinite(n)){const el=document.getElementById(k);settings[k]=Math.min(Number(el.max),Math.max(Number(el.min),n));el.value=settings[k]}}if(["9:16","3:4","1:1","16:9"].includes(o.ratio))document.getElementById("ratio").value=o.ratio;if(["en","zh"].includes(o.lang))document.getElementById("lang").value=o.lang;update()}
document.getElementById("save").onclick=()=>{const n=document.getElementById("name").value.trim();if(!n)return notice("請先輸入角色名稱");saved[n]=snapshot();localStorage.setItem(storageKey,JSON.stringify(saved));refresh();document.getElementById("saved").value=n;notice("已儲存："+n)};
document.getElementById("load").onclick=()=>{const n=val("saved");if(saved[n]){apply(saved[n]);document.getElementById("name").value=n;notice("已載入："+n)}};
document.getElementById("remove").onclick=()=>{const n=val("saved");if(n&&confirm("確定刪除 "+n+"？")){delete saved[n];localStorage.setItem(storageKey,JSON.stringify(saved));refresh();notice("已刪除")}};
document.getElementById("reset").onclick=()=>{for(const k of Object.keys(data))document.getElementById(k).selectedIndex=0;settings={age:20,mix:30,depth:45,realism:95};for(const k of Object.keys(settings))document.getElementById(k).value=settings[k];update();notice("已重設")};
document.getElementById("export").onclick=()=>download("character-presets.json",JSON.stringify(saved,null,2),"application/json");
document.getElementById("import").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!x||typeof x!=="object"||Array.isArray(x))throw Error();saved={...saved,...x};localStorage.setItem(storageKey,JSON.stringify(saved));refresh();notice("已匯入角色設定")}catch{notice("JSON 格式錯誤")}e.target.value=""};
refresh();update();</script></html>
